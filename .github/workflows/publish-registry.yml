# MD-199: list (or update the listing of) Markdown Pipeline on the official MCP Registry. Started by hand, then it waits for the owner's approval in the
# `mcp-registry` environment (add the owner as a required reviewer). OIDC login: there is no token anywhere. (`mcp-publisher login github` cannot publish
# under an organization namespace; OIDC from Actions can: Registry docs, "Authentication".) The PyPI package named in server.json must already exist.
name: publish-registry
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: mcp-registry
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6   # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: The entry is valid and its PyPI version exists
        run: |
          set -euo pipefail
          ./mcp-publisher validate server.json
          version="$(python3 -c 'import json; print(json.load(open("server.json"))["packages"][0]["version"])')"
          curl --fail --silent --show-error --output /dev/null "https://pypi.org/pypi/mdpipeline/${version}/json" \
            || { echo "mdpipeline ${version} is not on PyPI yet: publish it first"; exit 1; }
      - name: Authenticate to the MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
