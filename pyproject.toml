[project]
name = "mdpipeline"
version = "0.1.11"
description = "Local Markdown pipeline: project folders to a brain raw/ layer, with CLI, MCP and UI"
readme = "docs/pypi-readme.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Avi Koren", email = "maintainers@markdownpipeline.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "mcp>=2.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
mdpipeline = "mdpipeline.cli:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright==1.60.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --color=no"
markers = ["windows_unsupported(reason): cannot run on Windows; skipped there with the reason and listed in the run summary"]
